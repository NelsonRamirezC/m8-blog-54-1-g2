<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva publicación | M8 Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
</head>

<body data-page="create">
    <header id="site-nav"></header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-body p-4">
                    <h1 class="h3 mb-4">Nueva publicación</h1>
                    <div id="message" hidden></div>
                    <form id="post-form"><label class="form-label" for="titulo">Título</label><input
                            class="form-control mb-3" id="titulo" name="titulo" maxlength="255" required><label
                            class="form-label" for="contenido">Contenido</label><textarea class="form-control mb-4"
                            id="contenido" name="contenido" rows="10" required></textarea>
                        <div class="d-flex gap-2"><a class="btn btn-light" href="/">Cancelar</a><button
                                class="btn btn-primary">Publicar</button></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/app.js"></script>
</body>

</html>
