<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | M8 Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
</head>

<body data-page="register">
    <header id="site-nav"></header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card card-body p-4">
                    <h1 class="h3 mb-4">Crear cuenta</h1>
                    <div id="message" hidden></div>
                    <form id="register-form" enctype="multipart/form-data"><label class="form-label"
                            for="nombre">Nombre</label><input class="form-control mb-3" id="nombre" name="nombre"
                            required><label class="form-label" for="email">Correo electrónico</label><input
                            class="form-control mb-3" id="email" name="email" type="email" required><label
                            class="form-label" for="password">Contraseña</label><input class="form-control mb-3"
                            id="password" name="password" type="password" minlength="6" required><label
                            class="form-label" for="avatar">Avatar (opcional)</label><input class="form-control mb-4"
                            id="avatar" name="avatar" type="file"
                            accept="image/jpeg,image/jpg,image/svg+xml,image/webp"><button
                            class="btn btn-primary w-100">Registrarme</button></form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/app.js"></script>
</body>

</html>
