<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | M8 Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
</head>

<body data-page="login">
    <header id="site-nav"></header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-body p-4">
                    <h1 class="h3 mb-4">Iniciar sesión</h1>
                    <div id="message" hidden></div>
                    <form id="login-form"><label class="form-label" for="email">Correo electrónico</label><input
                            class="form-control mb-3" id="email" name="email" type="email" required><label
                            class="form-label" for="password">Contraseña</label><input class="form-control mb-4"
                            id="password" name="password" type="password" required><button
                            class="btn btn-primary w-100">Entrar</button></form>
                    <p class="text-muted mt-3 mb-0">¿Aún no tienes cuenta? <a href="/registro.html">Regístrate</a></p>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/app.js"></script>
</body>

</html>
